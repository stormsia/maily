name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: mypy
        run: mypy src
      - name: Pytest
        run: pytest -q
      - name: JS syntax check
        run: |
          for f in src/mailtmapi/static/js/*.js src/mailtmapi/static/js/pages/*.js; do
            node --input-type=module --check < "$f"
          done