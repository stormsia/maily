name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Check uv.lock consistency
        run: uv lock --check

      - name: Ruff Lint (with GitHub annotations)
        run: uv run ruff check --output-format=github src tests client scripts

      - name: Verify generated standalone client mirror
        # client/client.py is generated from src/mailtmapi/standalone_client.py;
        # a stale generated file is a build failure.
        run: uv run python scripts/build_client.py --check

      - name: JavaScript syntax check
        # Static ES modules, no build step / package.json. node --check parses
        # each file as ESM (missing semicolons/syntax errors fail here).
        run: |
          shopt -s nullglob
          for f in src/mailtmapi/static/js/*.js src/mailtmapi/static/js/pages/*.js; do
            echo "Checking $f..."
            node --input-type=module --check < "$f"
          done

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run mypy
        run: uv run mypy src client scripts

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Pytest suite
        # Test suite is hermetic by design: every Settings(...) in the tests
        # passes _env_file=None so a developer's local .env (MAILTM_API_KEY,
        # proxies, ...) can never leak into CI runs.
        # `python -m pytest` over bare `pytest`: guarantees the repo root is on
        # sys.path so `from tests.helpers import ...` resolves (tests is a
        # package via tests/__init__.py).
        # -n auto comes from addopts (pytest-xdist). Each test uses its own
        # tmp_path SQLite database, so workers do not share state.
        run: uv run python -m pytest -q

  package:
    name: Package Distribution Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Validate distribution metadata (twine check)
        run: uvx twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 5

  docker:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mailtmapi:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-status:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, package, docker]
    if: always()
    steps:
      - name: Generate summary report
        run: |
          python3 -c "
          import os
          results = {
              '🧹 Lint & Quality': '${{ needs.lint.result }}',
              '🔍 Type Check (mypy)': '${{ needs.type-check.result }}',
              '🧪 Test Matrix (Python 3.10 - 3.13)': '${{ needs.test.result }}',
              '📦 Package Build & Check': '${{ needs.package.result }}',
              '🐳 Docker Multi-Stage Build': '${{ needs.docker.result }}',
          }
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write('## 🚀 CI Pipeline Results\n\n')
                  f.write('| Stage | Status |\n| :--- | :---: |\n')
                  for name, status in results.items():
                      icon = '✅ Passed' if status == 'success' else ('⏭️ Skipped' if status == 'skipped' else '❌ Failed')
                      f.write(f'| {name} | {icon} |\n')
          "

      - name: Verify all required jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.package.result }}" != "success" ] || \
             [ "${{ needs.docker.result }}" != "success" ]; then
            echo "::error::One or more upstream CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed successfully!"
