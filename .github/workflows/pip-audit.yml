name: Security Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  audit:
    name: pip-audit (PyPA Advisory Database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras
          uv pip install pip

      - name: Run pip-audit vulnerability scan
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          virtual-environment: .venv
          summary: true

      - name: Generate pip-audit SARIF report
        if: always()
        run: |
          uv run --with pip-audit pip-audit -f json -o pip-audit.json || true
          uv run python scripts/pip_audit_to_sarif.py pip-audit.json pip-audit.sarif

      - name: Upload pip-audit SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: pip-audit.sarif
