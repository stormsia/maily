name: Dependabot Auto-Fix & Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-python-lockfile:
    if: (github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && !contains(github.event.pull_request.title, 'site')) || github.event_name == 'workflow_dispatch'
    name: Sync uv.lock and regenerate client
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Synchronize uv.lock & regenerate standalone client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge origin/main --no-edit; then
            echo "::error::Merge conflict with origin/main. Aborting."
            git merge --abort || true
            exit 1
          fi
          uv sync --frozen --all-extras || uv lock
          uv run python scripts/build_client.py

      - name: Commit and push changes if lockfile or client changed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock src/maily/standalone_client.py client/
          if ! git diff --staged --quiet; then
            git commit -m "chore(deps): auto-sync uv.lock and standalone client with dependabot bump"
            git push origin "HEAD:$HEAD_REF"
            echo "Changes committed and pushed. Triggering main CI workflow..."
            gh workflow run ci.yml --ref "$HEAD_REF" || true
          else
            echo "Lockfile and client are already up to date."
          fi

  auto-approve-and-merge:
    name: Auto-approve and enable auto-merge
    needs: [sync-python-lockfile]
    if: always() && github.actor == 'dependabot[bot]' && github.event_name == 'pull_request_target' && (needs.sync-python-lockfile.result == 'success' || needs.sync-python-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve and enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL" || echo "Auto-approve skipped."
          gh pr merge --auto --squash --delete-branch "$PR_URL" || gh pr merge --auto --merge --delete-branch "$PR_URL" || echo "Auto-merge flag skipped."
