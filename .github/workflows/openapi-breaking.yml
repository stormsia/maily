name: OpenAPI Breaking Changes Gate

on:
  pull_request:
    paths:
      - 'src/mailtmapi/**'
      - 'scripts/check_openapi_breaking.py'
      - '.github/workflows/openapi-breaking.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-breaking-changes:
    name: Check API Backwards Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "openapi-gate"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Generate current HEAD OpenAPI spec
        run: |
          uv run python -c "from mailtmapi.app.main import create_app; import json; json.dump(create_app().openapi(), open('head_openapi.json', 'w'))"

      - name: Generate base branch OpenAPI spec
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          git worktree add /tmp/base-branch "origin/$BASE_REF"
          (cd /tmp/base-branch && uv sync --frozen --all-extras && uv run python -c "from mailtmapi.app.main import create_app; import json; json.dump(create_app().openapi(), open('$GITHUB_WORKSPACE/base_openapi.json', 'w'))") || true
          git worktree remove --force /tmp/base-branch || true

      - name: Compare OpenAPI specifications
        run: |
          if [ -f base_openapi.json ]; then
            uv run python scripts/check_openapi_breaking.py base_openapi.json head_openapi.json
          else
            echo "Base OpenAPI spec could not be generated; skipping breaking check."
          fi
