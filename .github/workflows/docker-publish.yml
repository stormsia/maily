name: Publish Docker Image & Release Assets

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  docker-release:
    name: Build & Push Multi-Arch Image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Verify Git Tag matches pyproject.toml version
        run: |
          PKG_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          EXPECTED_TAG="v$PKG_VERSION"
          if [ "${{ github.ref_name }}" != "$EXPECTED_TAG" ] && [ "${{ github.ref_type }}" == "tag" ]; then
            echo "::error::Git tag (${{ github.ref_name }}) does not match package version ($EXPECTED_TAG)"
            exit 1
          fi
          echo "Version check passed: Tag ${{ github.ref_name }} matches pyproject.toml ($PKG_VERSION)"

      - name: Generate standalone client
        run: |
          uv sync --frozen
          uv run python scripts/build_client.py
          cp client/client.py mailtmapi-standalone-client.py

      - name: Set up QEMU (Multi-Arch)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'linux/amd64,linux/arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/tags/{0}', github.ref_name) }}

      - name: Build and push multi-architecture image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SPDX SBOM for Container
        uses: anchore/sbom-action@v0.18.0
        with:
          image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: 'spdx-json'
          output-file: 'mailtmapi-container-spdx.json'

      - name: Upload SBOM and Client to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            mailtmapi-container-spdx.json
            mailtmapi-standalone-client.py
            client/client.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
