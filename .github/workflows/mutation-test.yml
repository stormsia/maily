name: Mutation Testing (Nightly)

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  pull_request:
    paths:
      - 'src/mailtmapi/crypto.py'
      - 'src/mailtmapi/utils/misc.py'
      - 'tests/test_crypto.py'
      - 'tests/test_misc.py'
      - '.github/workflows/mutation-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  mutmut:
    name: Mutmut Code Robustness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "mutmut"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Mutation Tests on Core Modules
        run: |
          uv run --with mutmut mutmut run

      - name: Export CI/CD Mutation Stats
        if: always()
        run: |
          uv run --with mutmut mutmut export-cicd-stats || true

      - name: Display Mutation Test Results & Gate Check
        if: always()
        run: |
          python3 -c "
          import json, os, sys

          stats_file = 'mutants/mutmut-cicd-stats.json'
          if not os.path.exists(stats_file):
              print('::error::Mutation test stats file not found!')
              sys.exit(1)

          with open(stats_file) as f:
              stats = json.load(f)

          killed = stats.get('killed', 0)
          survived = stats.get('survived', 0)
          no_tests = stats.get('no_tests', 0)
          timeout = stats.get('timeout', 0)
          total = stats.get('total', 0)

          tested = total - stats.get('skipped', 0)
          score = 0.0 if tested <= 0 else ((killed + timeout) / tested) * 100

          print(f'Mutation summary: killed={killed}, survived={survived}, no_tests={no_tests}, timeout={timeout}, total={total}, score={score:.1f}%')

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as sf:
                  sf.write('### 🧬 Mutation Testing Results\n\n')
                  sf.write(f'- **Mutation Score:** {score:.1f}%\n')
                  sf.write(f'- **Total Mutants:** {total}\n')
                  sf.write(f'- **Killed:** {killed}\n')
                  sf.write(f'- **Survived:** {survived}\n')
                  sf.write(f'- **No Tests:** {no_tests}\n')
                  sf.write(f'- **Timeout:** {timeout}\n\n')

          if survived > 0 or no_tests > 0:
              print(f'::error::Mutation testing failed quality gate: {survived} survived, {no_tests} untested!')
              sys.exit(1)

          print('Mutation testing quality gate passed: 0 survived mutants.')
          "
