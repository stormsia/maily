# ==============================================================================
# Production Docker Compose for mailtmapi
# ==============================================================================
# Запуск:
#   docker compose up -d --build
# Просмотр логов:
#   docker compose logs -f mailtmapi
# Остановка:
#   docker compose down
#
# Настройки можно переопределять через файл .env в корне проекта.
# ==============================================================================

name: mailtmapi

services:
  mailtmapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: mailtmapi:latest
    container_name: mailtmapi
    restart: unless-stopped
    init: true

    security_opt:
      - no-new-privileges:true

    ports:
      - "${MAILTM_PORT:-8477}:8477"

    volumes:
      # Постоянное хранилище для базы SQLite (mailtm.db) и ключа шифрования (mailtm.key)
      - mailtmapi_data:/data
      # Для локальной разработки с live-кодом можно раскомментировать:
      # - ./src:/app/src:ro

    tmpfs:
      # Быстрый /tmp в оперативной памяти (ускоряет работу, снижает износ диска)
      - /tmp:size=32M,mode=1777

    env_file:
      - path: .env
        required: false

    environment:
      # --- Сетевые настройки ---
      - MAILTM_HOST=0.0.0.0
      - MAILTM_PORT=${MAILTM_PORT:-8477}

      # --- Безопасность и авторизация ---
      # При MAILTM_HOST=0.0.0.0 сервис строго требует непустой API-ключ.
      # По умолчанию задан безопасный ключ для быстрого старта, переопределите его в .env!
      - MAILTM_API_KEY=${MAILTM_API_KEY:-mailtm_secret_api_key_2026}
      - MAILTM_SECRET_KEY=${MAILTM_SECRET_KEY:-}
      - MAILTM_SECRET_KEY_PATH=${MAILTM_SECRET_KEY_PATH:-/data/mailtm.key}

      # --- База данных ---
      - MAILTM_DATABASE_URL=${MAILTM_DATABASE_URL:-sqlite+aiosqlite:////data/mailtm.db}

      # --- Проксирование и очистка ---
      - MAILTM_PROXY=${MAILTM_PROXY:-}
      - MAILTM_RETENTION_INTERVAL_SECONDS=${MAILTM_RETENTION_INTERVAL_SECONDS:-60}

      # --- Кеш доменов провайдеров ---
      - MAILTM_DOMAIN_CACHE_ENABLED=${MAILTM_DOMAIN_CACHE_ENABLED:-true}
      - MAILTM_DOMAIN_CACHE_INTERVAL_SECONDS=${MAILTM_DOMAIN_CACHE_INTERVAL_SECONDS:-1800}
      - MAILTM_PROVIDER_HEADERS_TTL_SECONDS=${MAILTM_PROVIDER_HEADERS_TTL_SECONDS:-21600}

      # --- Настройки провайдеров ---
      - MAILTM_TEMP_TF_GMAIL_DOT=${MAILTM_TEMP_TF_GMAIL_DOT:-true}
      - MAILTM_TEMP_TF_GMAIL_PLUS=${MAILTM_TEMP_TF_GMAIL_PLUS:-true}

      # --- Gmail OAuth (опционально) ---
      - MAILTM_GMAIL_CLIENT_ID=${MAILTM_GMAIL_CLIENT_ID:-}
      - MAILTM_GMAIL_CLIENT_SECRET=${MAILTM_GMAIL_CLIENT_SECRET:-}
      - MAILTM_GMAIL_REDIRECT_URI=${MAILTM_GMAIL_REDIRECT_URI:-}

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 64M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, urllib.request; port = os.getenv('MAILTM_PORT', '8477'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    networks:
      - mailtm_network

networks:
  mailtm_network:
    name: mailtm_network
    driver: bridge

volumes:
  mailtmapi_data:
    name: mailtmapi_data
