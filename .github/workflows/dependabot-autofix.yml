name: Dependabot uv.lock Auto-Fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  fix-lockfile:
    if: github.actor == 'dependabot[bot]'
    name: Sync uv.lock and auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Synchronize uv.lock & regenerate standalone client
        run: |
          uv sync --frozen --all-extras || uv lock
          uv run python scripts/build_client.py

      - name: Commit and push changes if lockfile or client changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore(deps): auto-sync uv.lock and standalone client with dependabot bump"
            git push
            echo "Changes committed and pushed. Triggering main CI workflow..."
            gh workflow run ci.yml --ref "${{ github.head_ref }}" || true
          else
            echo "Lockfile and client are already up to date."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve and enable auto-merge for Dependabot PR
        run: |
          gh pr review --approve "$PR_URL" || echo "Auto-approve skipped (enable 'Allow GitHub Actions to create and approve pull requests' in repository settings if desired)."
          gh pr merge --auto --merge "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
