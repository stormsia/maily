name: Trivy Container & Repository Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 2' # Weekly on Tuesday at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  trivy:
    name: Trivy Container & OS Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mailtmapi:trivy-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy container vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'mailtmapi:trivy-scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Run Trivy container scanner (Table output for log & summary)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'mailtmapi:trivy-scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '1'

      - name: Upload Trivy SARIF results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy SARIF Artifact
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          name: trivy-container-sarif
          path: trivy-results.sarif
          retention-days: 14
