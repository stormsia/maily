[files]
extend-exclude = ["CHANGELOG.md"]

[default]
extend-ignore-re = [
    '(?i)HcTsW_BHeZm9dWhe',
    '(?i)CDNKAWl4687wKMey',
]

[default.extend-words]
ede = "ede"
INSER = "INSER"
nd = "nd"
Whe = "Whe"
Mey = "Mey"
maily = "maily"
alembic = "alembic"
aiosqlite = "aiosqlite"
mutmut = "mutmut"
deptry = "deptry"
pydantic = "pydantic"
uvicorn = "uvicorn"
fastapi = "fastapi"
