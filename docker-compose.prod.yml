# ==============================================================================
# Production Docker Compose for maily (Pre-built Image from GHCR)
# ==============================================================================
# Quick Start (no git clone required):
#   curl -O https://raw.githubusercontent.com/stormsia/maily/main/docker-compose.prod.yml
#   docker compose -f docker-compose.prod.yml up -d
#
# View logs:
#   docker compose -f docker-compose.prod.yml logs -f maily
#
# Update to latest version:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Stop:
#   docker compose -f docker-compose.prod.yml down
#
# Settings can be overridden via .env file in the same directory.
# ==============================================================================

name: maily

services:
  maily:
    image: ghcr.io/stormsia/maily:${MAILY_VERSION:-latest}
    container_name: maily
    restart: unless-stopped
    init: true

    security_opt:
      - no-new-privileges:true

    ports:
      - "${MAILY_PORT:-8477}:8477"

    volumes:
      # Persistent storage for SQLite DB (maily.db) and encryption key (maily.key)
      - maily_data:/data

    tmpfs:
      # Fast in-memory /tmp (speeds up operations, reduces disk wear)
      - /tmp:size=32M,mode=1777

    env_file:
      - path: .env
        required: false

    environment:
      # --- Network settings ---
      - MAILY_HOST=0.0.0.0
      - MAILY_PORT=${MAILY_PORT:-8477}

      # --- Security and authentication ---
      # When MAILY_HOST=0.0.0.0, the service strictly requires a non-empty API key.
      # A safe default key is provided for quick start; override it in .env!
      - MAILY_API_KEY=${MAILY_API_KEY:-your_secret_api_key}
      - MAILY_SECRET_KEY=${MAILY_SECRET_KEY:-}
      - MAILY_SECRET_KEY_PATH=${MAILY_SECRET_KEY_PATH:-/data/maily.key}

      # --- Database ---
      - MAILY_DATABASE_URL=${MAILY_DATABASE_URL:-sqlite+aiosqlite:////data/maily.db}

      # --- Proxying and retention ---
      - MAILY_PROXY=${MAILY_PROXY:-}
      - MAILY_RETENTION_INTERVAL_SECONDS=${MAILY_RETENTION_INTERVAL_SECONDS:-60}

      # --- Provider domain cache ---
      - MAILY_DOMAIN_CACHE_ENABLED=${MAILY_DOMAIN_CACHE_ENABLED:-true}
      - MAILY_DOMAIN_CACHE_INTERVAL_SECONDS=${MAILY_DOMAIN_CACHE_INTERVAL_SECONDS:-1800}
      - MAILY_PROVIDER_HEADERS_TTL_SECONDS=${MAILY_PROVIDER_HEADERS_TTL_SECONDS:-21600}

      # --- Provider settings ---
      - MAILY_TEMP_TF_GMAIL_DOT=${MAILY_TEMP_TF_GMAIL_DOT:-true}
      - MAILY_TEMP_TF_GMAIL_PLUS=${MAILY_TEMP_TF_GMAIL_PLUS:-true}

      # --- Gmail OAuth (optional) ---
      - MAILY_GMAIL_CLIENT_ID=${MAILY_GMAIL_CLIENT_ID:-}
      - MAILY_GMAIL_CLIENT_SECRET=${MAILY_GMAIL_CLIENT_SECRET:-}
      - MAILY_GMAIL_REDIRECT_URI=${MAILY_GMAIL_REDIRECT_URI:-}

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 64M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, urllib.request; port = os.getenv('MAILY_PORT', '8477'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    networks:
      - maily_network

networks:
  maily_network:
    name: maily_network
    driver: bridge

volumes:
  maily_data:
    name: maily_data
