name: Security Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1' # Weekly on Monday at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  audit:
    name: pip-audit (PyPA Advisory Database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Run pip-audit vulnerability scan
        id: run-audit
        run: |
          AUDIT_EXIT=0
          uv run --with pip-audit pip-audit -f json -o pip-audit.json || AUDIT_EXIT=$?
          echo "audit_exit=$AUDIT_EXIT" >> "$GITHUB_OUTPUT"
          uv run python scripts/pip_audit_to_sarif.py pip-audit.json pip-audit.sarif

      - name: Render Audit Summary to Job
        if: always() && hashFiles('pip-audit.json') != ''
        run: |
          python3 -c "
          import json, os
          with open('pip-audit.json') as f:
              data = json.load(f)
          deps = data.get('dependencies', []) if isinstance(data, dict) else (data if isinstance(data, list) else [])
          vulns_found = []
          for d in deps:
              for v in d.get('vulns', []):
                  vulns_found.append((d.get('name'), d.get('version'), v.get('id'), ', '.join(v.get('fix_versions', []))))
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as sf:
                  sf.write('### 🛡️ Dependency Vulnerability Audit (pip-audit)\n\n')
                  if not vulns_found:
                      sf.write(f'✅ **Scanned {len(deps)} dependencies: No known vulnerabilities found.**\n\n')
                  else:
                      sf.write(f'⚠️ **Found {len(vulns_found)} vulnerabilities in dependencies!**\n\n')
                      sf.write('| Package | Version | Advisory ID | Fix Versions |\n')
                      sf.write('| :--- | :---: | :---: | :---: |\n')
                      for pkg, ver, vid, fix in vulns_found:
                          sf.write(f'| `{pkg}` | `{ver}` | `{vid}` | `{fix}` |\n')
          "

      - name: Upload Audit Reports Artifact
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('pip-audit.json') != ''
        with:
          name: pip-audit-reports
          path: |
            pip-audit.json
            pip-audit.sarif
          retention-days: 14

      - name: Upload pip-audit SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('pip-audit.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: pip-audit.sarif

      - name: Verify zero vulnerabilities
        run: |
          if [ "${{ steps.run-audit.outputs.audit_exit }}" != "0" ]; then
            echo "::error::pip-audit detected vulnerabilities in dependencies!"
            exit 1
          fi
          echo "Security audit clean: 0 vulnerabilities found."
