[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailtmapi-client"
version = "0.3.0"
description = "Standalone single-file async client for a self-hosted mailtmapi server"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "loguru>=0.7",
    "pydantic>=2",
]

[project.scripts]
mailtmapi-client = "client:_main"

[tool.setuptools]
py-modules = ["client"]
