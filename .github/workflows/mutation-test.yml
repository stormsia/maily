name: Mutation Testing (Nightly)

on:
  schedule:
    - cron: '0 2 * * 3' # Weekly on Wednesday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: Mutmut Code Robustness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Mutation Tests on Core Modules
        run: |
          uvx mutmut run --paths-to-mutate=src/mailtmapi/utils/misc.py,src/mailtmapi/crypto.py || true
          uvx mutmut results
