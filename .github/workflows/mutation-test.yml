name: Mutation Testing Suite

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  pull_request:
    paths:
      - 'src/mailtmapi/**'
      - 'tests/**'
      - 'scripts/run_mutation_gate.py'
      - 'pyproject.toml'
      - '.github/workflows/mutation-test.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Mutation Profile to Run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - crypto_misc
          - auth_security
          - retention_retry

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pr-diff-mutation:
    name: PR Diff Mutation Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR HEAD with Base
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "mutmut-pr"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Diff-Aware Mutation Tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          uv run --with mutmut python scripts/run_mutation_gate.py --diff-base "origin/$BASE_REF"

  matrix-mutation:
    name: Module Robustness (${{ matrix.profile }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [crypto_misc, auth_security, retention_retry]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "mutmut-matrix-${{ matrix.profile }}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Profile Mutation Tests
        run: |
          uv run --with mutmut python scripts/run_mutation_gate.py --profile ${{ matrix.profile }}
