[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailtmapi-client"
version = "0.3.0"
description = "Standalone single-file async client for a self-hosted mailtmapi server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["temporary-email", "disposable-email", "testing", "automation", "mailtm", "client", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "loguru>=0.7",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/stormsia/mailtmapi"
Repository = "https://github.com/stormsia/mailtmapi"
Issues = "https://github.com/stormsia/mailtmapi/issues"
Documentation = "https://github.com/stormsia/mailtmapi#readme"

[project.scripts]
mailtmapi-client = "client:_main"

[tool.setuptools]
py-modules = ["client"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
