name: Publish maily-client to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Target PyPI environment"
        type: choice
        options:
          - pypi
          - testpypi
        default: pypi

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  pypi-publish-client:
    name: Upload maily-client to PyPI (OIDC Trusted Publisher)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/maily-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Verify SemVer and Package Consistency
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python3 scripts/check_version_consistency.py --tag "$REF_NAME"
          else
            python3 scripts/check_version_consistency.py
          fi
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}

      - name: Verify CI Status on Commit
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Checking CI status for commit $GITHUB_SHA..."
          CONCLUSION=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml --json conclusion,status --jq '.[] | select(.status == "completed") | .conclusion' | head -n 1)
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI check failed with conclusion: $CONCLUSION. Aborting publication."
            exit 1
          fi
          echo "CI check status: ${CONCLUSION:-no completed CI run found (proceeding)}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Client Parity
        run: python3 scripts/build_client.py --check

      - name: Build client sdist and wheel
        run: uv build client/

      - name: Validate distribution metadata
        run: uvx twine check --strict client/dist/*

      - name: Smoke Test Built Client Wheel
        run: |
          uv venv .smoke_venv
          uv pip install --python .smoke_venv client/dist/*.whl
          .smoke_venv/bin/python3 -c "import maily_client; print('Imported maily_client version:', maily_client.__version__)"
          .smoke_venv/bin/python3 -c "import client; print('Imported client version:', client.__version__)"
          .smoke_venv/bin/python3 -c "from maily_client import Maily, SyncMaily; print('Imported Maily successfully')"
          .smoke_venv/bin/maily-client --help > /dev/null
          rm -rf .smoke_venv

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: "client/dist/*"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: maily-client-distributions
          path: client/dist/
          retention-days: 14

      - name: Publish client package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          packages-dir: client/dist/
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
