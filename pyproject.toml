[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailtmapi"
version = "0.3.0"
description = "Local multi-provider mail API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.0.55",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "pydantic-settings>=2.6",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "cryptography>=50.0.2",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-asyncio>=0.24", "pytest-xdist>=3.6", "ruff>=0.17.3", "mypy>=2.4.0"]

[project.scripts]
mailtmapi = "mailtmapi.app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mailtmapi"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Each test builds its own temp SQLite via tmp_path, so workers do not share a database.
addopts = "-n auto"
# "src" makes the package importable; "." (repo root) makes `tests` importable
# as a package (`tests.helpers`) even when pytest is invoked as a bare script
# instead of `python -m pytest`.
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter
    "BLE001",  # worker loops handle broad exceptions on purpose
]

[tool.ruff.lint.isort]
# Make first-party classification stable across ruff versions; otherwise the
# `tests` package is sorted by version-dependent heuristic heuristics and CI
# (fresh install) may differ from the local venv.
known-first-party = ["mailtmapi", "tests"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
