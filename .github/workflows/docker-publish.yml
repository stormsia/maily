name: Publish Docker Image & Release Assets

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  docker-release:
    name: Build & Push Multi-Arch Image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute Lowercase Image Name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Verify SemVer and Git Tag Consistency
        run: python3 scripts/check_version_consistency.py --tag "$REF_NAME"
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Generate standalone client
        run: |
          uv sync --frozen
          uv run python scripts/build_client.py
          cp client/client.py maily-standalone-client.py

      - name: Set up QEMU (Multi-Arch)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: "linux/amd64,linux/arm64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/tags/{0}', github.ref_name) }}

      - name: Build and push multi-architecture image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SPDX SBOM for Container
        uses: anchore/sbom-action@v0.24.3
        continue-on-error: true
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: "spdx-json"
          output-file: "maily-container-spdx.json"

      - name: Generate build provenance attestations for container image
        uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOM and Client to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            maily-container-spdx.json
            maily-standalone-client.py
            client/client.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
