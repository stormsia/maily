name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests client scripts
      - name: mypy
        run: mypy src
      - name: Standalone client mirror
        # client/client.py is generated from src/mailtmapi/standalone_client.py;
        # a stale generated file is a build failure.
        run: python scripts/build_client.py --check
      - name: Pytest
        # Test suite is hermetic by design: every Settings(...) in the tests
        # passes _env_file=None so a developer's local .env (MAILTM_API_KEY,
        # proxies, ...) can never leak into CI runs.
        # `python -m pytest` over bare `pytest`: guarantees the repo root is on
        # sys.path so `from tests.helpers import ...` resolves (tests is a
        # package via tests/__init__.py).
        # -n auto comes from addopts (pytest-xdist). Each test uses its own
        # tmp_path SQLite database, so workers do not share state.
        run: python -m pytest -q
      - name: JS syntax check
        # Static ES modules, no build step / package.json. node --check parses
        # each file as ESM (missing semicolons/typos fail here).
        run: |
          for f in src/mailtmapi/static/js/*.js src/mailtmapi/static/js/pages/*.js; do
            node --input-type=module --check < "$f"
          done