name: Gitlytics Daily Traffic Sync & Audit

on:
  schedule:
    # Запуск каждый день в 03:00 UTC (1 раз в сутки)
    - cron: '0 3 * * *'
  # Возможность ручного запуска из вкладки Actions для проверки
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-traffic:
    name: Sync & Log Repository Traffic
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Gitlytics
        run: |
          python -m pip install --upgrade pip
          pip install gitlytics

      # 1. ПОДРОБНЫЙ ВЫВОД В КОНСОЛЬ: живой срез за 14 дней перед записью
      - name: 📊 Fetch live stats to console log
        env:
          GITHUB_TOKEN: ${{ secrets.GITLYTICS_TOKEN_PUB_REPS }}
        run: |
          echo "=================== LIVE TRAFFIC SNAPSHOT ==================="
          gitlytics fetch --token "$GITHUB_TOKEN" --print-table || true
          echo "============================================================="

      # 2. СИНХРОНИЗАЦИЯ: сохраняем CSV и сводный JSON
      - name: 💾 Sync metrics to persistent storage
        env:
          GITHUB_TOKEN: ${{ secrets.GITLYTICS_TOKEN_PUB_REPS }}
        run: |
          mkdir -p ./traffic_data
          gitlytics sync \
            --token "$GITHUB_TOKEN" \
            --data-dir "./traffic_data" \
            --export-json "./traffic_data/traffic_summary.json"

      # 3. ЛОГИРОВАНИЕ ФАЙЛОВ И ДЕЛЬТЫ В КОНСОЛЬ
      - name: 📋 Audit generated files
        run: |
          echo "### Проверка сформированных файлов в traffic_data/:"
          ls -lh ./traffic_data/
          echo ""
          echo "### Количество строк в CSV (накопленная история):"
          wc -l ./traffic_data/*.csv || true
          echo ""
          echo "### Статус изменений git:"
          git status --short ./traffic_data/

      # 4. ФОРМИРОВАНИЕ СВОДКИ В GITHUB STEP SUMMARY (UI Actions)
      - name: 📝 Generate GitHub Step Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 📈 Gitlytics Traffic Report

          Синхронизация статистики активности репозитория успешно завершена.

          ### 📁 Сохранённые файлы:
          EOF

          echo "| Файл | Размер | Записей (строк) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for file in ./traffic_data/*.csv; do
            if [ -f "$file" ]; then
              fname=$(basename "$file")
              fsize=$(ls -lh "$file" | awk '{print $5}')
              flines=$(wc -l < "$file")
              echo "| \`$fname\` | $fsize | $flines |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🕒 _Время запуска: $(date -u '+%Y-%m-%d %H:%M:%S UTC')_" >> $GITHUB_STEP_SUMMARY

      # 5. КОММИТ И ПУШ В РЕПОЗИТОРИЙ
      - name: 🚀 Commit & Push updated stats
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(analytics): update daily traffic metrics [skip ci]"
          file_pattern: "traffic_data/*"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
