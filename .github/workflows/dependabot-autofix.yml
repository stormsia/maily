name: Dependabot uv.lock Auto-Fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  fix-lockfile:
    if: github.actor == 'dependabot[bot]'
    name: Sync uv.lock and auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Synchronize uv.lock
        run: uv lock

      - name: Commit and push changes if uv.lock changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --staged --quiet; then
            git commit -m "chore(deps): auto-sync uv.lock with dependabot bump"
            git push
            echo "uv.lock updated and pushed. Triggering main CI workflow..."
            gh workflow run ci.yml --ref "${{ github.head_ref }}" || true
          else
            echo "uv.lock is already up to date."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve and enable auto-merge for Dependabot PR
        run: |
          gh pr review --approve "$PR_URL" || echo "Auto-approve skipped (enable 'Allow GitHub Actions to create and approve pull requests' in repository settings if desired)."
          gh pr merge --auto --merge "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
