name: Mutation Testing (Nightly)

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  pull_request:
    paths:
      - 'src/mailtmapi/crypto.py'
      - 'src/mailtmapi/utils/misc.py'
      - '.github/workflows/mutation-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: Mutmut Code Robustness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Mutation Tests on Core Modules
        run: |
          uv run --with mutmut mutmut run \
            --paths-to-mutate=src/mailtmapi/utils/misc.py,src/mailtmapi/crypto.py \
            --runner="pytest -q -n 0 tests/test_crypto.py tests/test_benchmarks.py"

      - name: Display Mutation Test Results & Summary
        if: always()
        run: |
          RESULTS=$(uv run --with mutmut mutmut results || true)
          echo "$RESULTS"
          summary_path="$GITHUB_STEP_SUMMARY"
          if [ -n "$summary_path" ]; then
            echo "### 🧬 Mutation Testing Results" >> "$summary_path"
            echo '```text' >> "$summary_path"
            echo "$RESULTS" >> "$summary_path"
            echo '```' >> "$summary_path"
          fi
