name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Check uv.lock consistency
        run: uv lock --check

      - name: Ruff Lint (with GitHub annotations)
        run: uv run ruff check --output-format=github src tests client scripts

      - name: Alembic Migrations Consistency Check
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Clean Dependency Architecture (Deptry)
        run: uvx deptry src

      - name: Verify generated standalone client mirror
        run: uv run python scripts/build_client.py --check

      - name: JavaScript syntax check (ESM)
        run: |
          shopt -s nullglob
          for f in src/mailtmapi/static/js/*.js src/mailtmapi/static/js/pages/*.js; do
            echo "Checking $f..."
            node --input-type=module --check < "$f"
          done

      - name: Static Frontend Assets Lint (Biome & HTMLHint)
        run: |
          npx --yes @biomejs/biome check src/mailtmapi/static/js
          npx --yes htmlhint src/mailtmapi/static/*.html

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run mypy
        run: uv run mypy src client scripts

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Pytest suite
        if: matrix.python-version != '3.12'
        run: uv run python -m pytest -q

      - name: Run Pytest suite with coverage (Python 3.12)
        if: matrix.python-version == '3.12'
        run: uv run python -m pytest -q -n 0 --cov=mailtmapi --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  package:
    name: Package Distribution Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Validate distribution metadata (twine check)
        run: uvx twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 5

  docker:
    name: Docker Build & Runtime Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mailtmapi:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker container starts and API responds
        run: |
          docker run -d -p 8477:8477 --name ci-smoke-app mailtmapi:ci-test
          sleep 4
          curl --fail --retry 5 --retry-delay 2 http://localhost:8477/health || {
            echo "::error::Container health check failed. Dumping logs:"
            docker logs ci-smoke-app
            exit 1
          }
          echo "Docker smoke test passed: /health responded successfully."
          docker stop ci-smoke-app
          docker rm ci-smoke-app

  ci-status:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, package, docker]
    if: always()
    steps:
      - name: Generate summary report
        run: |
          python3 -c "
          import os
          results = {
              '🧹 Lint & Quality': '${{ needs.lint.result }}',
              '🔍 Type Check (mypy)': '${{ needs.type-check.result }}',
              '🧪 Test Matrix (Python 3.10 - 3.13)': '${{ needs.test.result }}',
              '📦 Package Build & Check': '${{ needs.package.result }}',
              '🐳 Docker Multi-Stage Build & Smoke': '${{ needs.docker.result }}',
          }
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write('## 🚀 CI Pipeline Results\n\n')
                  f.write('| Stage | Status |\n| :--- | :---: |\n')
                  for name, status in results.items():
                      icon = '✅ Passed' if status == 'success' else ('⏭️ Skipped' if status == 'skipped' else '❌ Failed')
                      f.write(f'| {name} | {icon} |\n')
          "

      - name: Verify all required jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.package.result }}" != "success" ] || \
             [ "${{ needs.docker.result }}" != "success" ]; then
            echo "::error::One or more upstream CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed successfully!"
