[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailtmapi"
version = "0.2.0"
description = "Local multi-provider mail API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "loguru>=0.7",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
mailtmapi = "mailtmapi.app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mailtmapi"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
