name: Publish maily-server to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  pypi-publish:
    name: Upload maily-server to PyPI (OIDC Trusted Publisher)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/maily-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Verify SemVer and Git Tag Consistency
        run: python3 scripts/check_version_consistency.py --tag "$REF_NAME"
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Build sdist and wheel
        run: uv build

      - name: Validate distribution metadata
        run: uvx twine check --strict dist/*

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: "dist/*"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: maily-server-distributions
          path: dist/
          retention-days: 14

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/')
