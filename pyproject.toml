[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailtmapi"
version = "0.2.0"
description = "Local multi-provider mail API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "loguru>=0.7",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
mailtmapi = "mailtmapi.app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mailtmapi"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
# "src" makes the package importable; "." (repo root) makes `tests` importable
# as a package (`tests.helpers`) even when pytest is invoked as a bare script
# instead of `python -m pytest`.
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter
    "BLE001",  # worker loops handle broad exceptions on purpose
]

[tool.ruff.lint.isort]
# Make first-party classification stable across ruff versions; otherwise the
# `tests` package is sorted by version-dependent heuristic heuristics and CI
# (fresh install) may differ from the local venv.
known-first-party = ["mailtmapi", "tests"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
