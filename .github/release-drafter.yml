name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features & Enhancements'
    labels:
      - 'feature'
      - 'enhancement'
      - 'area:core'
      - 'area:providers'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '🔒 Security Updates'
    labels:
      - 'security'
  - title: '🧹 Maintenance & Dependencies'
    labels:
      - 'dependencies'
      - 'area:ci'
      - 'chore'
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking-change'
  minor:
    labels:
      - 'minor'
      - 'enhancement'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'bug'
      - 'fix'
      - 'dependencies'
  default: patch
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/stormsia/mailtmapi/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
