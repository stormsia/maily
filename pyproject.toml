[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maily-server"
version = "0.4.1"
description = "Local multi-provider mail API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "pydantic-settings>=2.16.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "cryptography>=50.0.2",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "pytest-cov>=7.1.0",
    "pytest-benchmark>=5.3.0",
    "diff-cover>=11.0.0",
    "hypothesis>=6.170.14",
    "locust>=2.47.0",
]

[project.scripts]
maily = "maily.app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/maily"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Each test builds its own temp SQLite via tmp_path, so workers do not share a database.
addopts = "-n auto"
# "src" makes the package importable; "." (repo root) makes `tests` importable
# as a package (`tests.helpers`) even when pytest is invoked as a bare script
# instead of `python -m pytest`.
pythonpath = ["src", ".", "scripts"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore:.*Event loop is closed.*:RuntimeWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter
    "BLE001",  # worker loops handle broad exceptions on purpose
    "UP017",  # allow timezone.utc without forced datetime.UTC migration
]

[tool.ruff.lint.isort]
# Make first-party classification stable across ruff versions; otherwise the
# `tests` package is sorted by version-dependent heuristic heuristics and CI
# (fresh install) may differ from the local venv.
known-first-party = ["maily", "tests"]

[tool.mypy]
python_version = "3.15"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = false
warn_redundant_casts = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.test_client", "tests.test_client_standalone", "tests.test_sdk"]
ignore_errors = false

[tool.coverage.run]
source = ["src/maily"]
omit = ["src/maily/static/*", "*/tests/*"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.vulture]
min_confidence = 80
paths = ["src"]
ignore_names = ["cls", "model_config"]

[tool.deptry]
ignore = ["DEP002"]

[tool.deptry.per_rule_ignores]
DEP001 = ["starlette", "pydantic"]

[tool.mutmut]
source_paths = ["src"]
also_copy = [
    "alembic.ini",
]
only_mutate = [
    "src/maily/utils/misc.py",
    "src/maily/crypto.py",
    "src/maily/app/authz.py",
    "src/maily/app/services/keys.py",
    "src/maily/app/services/retention.py",
    "src/maily/utils/retry.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_crypto.py",
    "tests/test_misc.py",
    "tests/test_authz.py",
    "tests/test_authz_properties.py",
    "tests/test_keys_service.py",
    "tests/test_keys_router.py",
    "tests/test_api_keys.py",
    "tests/test_security_routing.py",
    "tests/test_scope_filters.py",
    "tests/test_mailbox_ownership.py",
    "tests/test_retention_lifecycle.py",
    "tests/test_retention_scope.py",
    "tests/test_stats_retention_history.py",
    "tests/test_retry.py",
]
pytest_add_cli_args = [
    "-q",
    "-n",
    "0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "locust>=2.47.0",
]
