[extend]
useDefault = true

[allowlist]
description = "Allowlist for mock credentials, test fixtures, and documentation examples"
paths = [
  '''tests/.*''',
  '''\.env\.example''',
  '''README\.md''',
  '''pyproject\.toml''',
  '''\.github/workflows/.*''',
]
regexes = [
  '''Bearer mock_.*''',
  '''[0-9a-f]{32}''',
  '''dummy_.*''',
  '''ci-smoke-test-secret''',
]
