name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Check changed paths
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          CODE_CHANGED="false"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --depth=100
            CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD" || git diff --name-only "origin/$BASE_REF..HEAD")
            echo "Changed files in PR:"
            echo "$CHANGED_FILES"
            if echo "$CHANGED_FILES" | grep -qvE '^(\.github/|docs/|.*\.md$|lychee\.toml|\.gitignore)'; then
              CODE_CHANGED="true"
            fi
          else
            CODE_CHANGED="true"
          fi
          echo "code=${CODE_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Code changes detected: ${CODE_CHANGED}"

  lint:
    name: Lint & Quality
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "lint"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Check uv.lock consistency
        run: uv lock --check

      - name: Check for spelling typos
        uses: crate-ci/typos@v1.52.0

      - name: Ruff Lint (with GitHub annotations)
        run: |
          uv run ruff check --output-format=github src tests client scripts
          uv run ruff format --check src tests client scripts

      - name: Dead code analysis (Vulture)
        run: uv run --with vulture vulture src --min-confidence 80 --ignore-names "cls,model_config"

      - name: Alembic Migrations Consistency Check
        run: |
          uv run alembic upgrade head
          uv run alembic check
          rm -f maily.db

      - name: Clean Dependency Architecture (Deptry)
        run: uvx deptry src

      - name: Verify SemVer and Package Version Consistency
        run: uv run python scripts/check_version_consistency.py

      - name: Verify generated standalone client mirror
        run: uv run python scripts/build_client.py --check

      - name: Verify documentation sync from docs/
        run: uv run python scripts/build_docs.py --check

      - name: Validate OpenAPI Schema Generation
        run: uv run python -c "from maily.app.main import create_app; schema = create_app().openapi(); assert len(schema.get('paths', {})) > 0, 'OpenAPI paths empty'"

      - name: JavaScript syntax check (ESM) & Biome Lint
        run: |
          for f in src/maily/static/js/*.js src/maily/static/js/pages/*.js; do
            [ -f "$f" ] && node --check "$f"
          done
          npx --yes @biomejs/biome check src/maily/static/js || true

      - name: Static HTML Assets Lint (HTMLHint)
        run: |
          npx --yes htmlhint src/maily/static/*.html

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "mypy"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run mypy
        run: uv run mypy src client scripts

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "test-${{ matrix.python-version }}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Pytest suite
        if: matrix.python-version != '3.15'
        run: uv run python -m pytest -q -n 0 --junitxml=junit-${{ matrix.python-version }}.xml

      - name: Run Pytest suite with coverage (Python 3.15)
        if: matrix.python-version == '3.15'
        run: |
          uv run python -m pytest -q -n 0 --cov=maily --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=junit-3.15.xml
          uv run coverage json -o coverage.json

      - name: Check PR Diff Coverage
        if: matrix.python-version == '3.15' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git fetch origin "$BASE_REF" --depth=100
          uv run python scripts/check_diff_coverage.py coverage.xml --compare-branch="origin/$BASE_REF" --threshold=85.0 --json-output=diff-coverage.json --sticky-pr

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.15'
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test & coverage metrics artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit-*.xml
            coverage.json
            coverage.xml
            diff-coverage.json
          if-no-files-found: ignore
          retention-days: 1

  package:
    name: Package Distribution Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "pkg"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Build sdist and wheel
        run: |
          uv build
          uv build client/

      - name: Validate distribution metadata (twine check)
        run: |
          uvx twine check --strict dist/*
          uvx twine check --strict client/dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 5

  docker:
    name: Docker Build & Runtime Smoke Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: maily:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker container starts and API responds
        run: |
          SMOKE_KEY="dummy_ci_smoke_key"
          START_TIME=$(date +%s)
          docker run -d -p 8477:8477 -e MAILY_API_KEY="$SMOKE_KEY" --name ci-smoke-app maily:ci-test
          READY=0
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:8477/health > /dev/null 2>&1; then
              READY=1
              END_TIME=$(date +%s)
              DURATION=$(( END_TIME - START_TIME ))
              echo "Docker smoke test passed: /health responded successfully in ${DURATION}s on attempt ${i}."
              mkdir -p test-metrics
              echo "{\"startup_time\": \"${DURATION}s\", \"status\": \"Healthy\"}" > test-metrics/docker-smoke.json
              break
            fi
            echo "Waiting for container startup and migrations... (${i}/30)"
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::Container health check failed after 60s. Dumping logs:"
            docker logs ci-smoke-app
            exit 1
          fi
          echo "Verifying authenticated /v1/providers endpoint..."
          AUTH_HEADER="X-API-Key: ${SMOKE_KEY}"
          PROVIDERS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH_HEADER" http://127.0.0.1:8477/v1/providers || true)
          if [ "$PROVIDERS_STATUS" != "200" ]; then
            echo "::error::Authenticated /v1/providers check failed with status ${PROVIDERS_STATUS}."
            docker logs ci-smoke-app
            exit 1
          fi
          echo "Docker smoke test verified /health and /v1/providers successfully."
          docker stop ci-smoke-app && docker rm ci-smoke-app

      - name: Upload Docker smoke metrics artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-smoke-results
          path: test-metrics/docker-smoke.json
          if-no-files-found: ignore
          retention-days: 1

  ci-status:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [changes, lint, type-check, test, package, docker]
    if: always()
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download test & smoke metrics
        uses: actions/download-artifact@v8
        with:
          pattern: "*-results*"
          merge-multiple: true
          path: test-metrics
        continue-on-error: true

      - name: Generate Executive Step Summary Dashboard
        run: |
          python3 scripts/generate_ci_dashboard.py --sticky-pr
        env:
          METRICS_DIR: test-metrics
          CI_LINT_STATUS: ${{ needs.lint.result }}
          CI_MYPY_STATUS: ${{ needs.type-check.result }}
          CI_TEST_STATUS: ${{ needs.test.result }}
          CI_PKG_STATUS: ${{ needs.package.result }}
          CI_DOCKER_STATUS: ${{ needs.docker.result }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Verify all required jobs succeeded
        env:
          CI_LINT_STATUS: ${{ needs.lint.result }}
          CI_MYPY_STATUS: ${{ needs.type-check.result }}
          CI_TEST_STATUS: ${{ needs.test.result }}
          CI_PKG_STATUS: ${{ needs.package.result }}
          CI_DOCKER_STATUS: ${{ needs.docker.result }}
        run: |
          for status in "${CI_LINT_STATUS}" "${CI_MYPY_STATUS}" "${CI_TEST_STATUS}" "${CI_PKG_STATUS}" "${CI_DOCKER_STATUS}"; do
            if [ "$status" = "failure" ]; then
              echo "::error::One or more upstream CI jobs failed."
              exit 1
            fi
          done
          if [ "${CI_LINT_STATUS}" != "success" ]; then
            echo "::error::Lint job must pass successfully."
            exit 1
          fi
          echo "All CI jobs passed successfully!"
