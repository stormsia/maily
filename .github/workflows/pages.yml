name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build API Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Export OpenAPI Schema and generate static API documentation
        run: |
          mkdir -p public
          uv run python -c "
          import json
          from mailtmapi.app.main import create_app
          app = create_app()
          schema = app.openapi()
          with open('public/openapi.json', 'w', encoding='utf-8') as f:
              json.dump(schema, f, indent=2)
          "
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>mailtmapi API Interactive Documentation (Swagger UI)</title>
            <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
            <style>
              body { margin: 0; background: #f8fafc; font-family: system-ui, sans-serif; }
              .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #0f172a; border-bottom: 1px solid #334155; color: #f8fafc; }
              .top-nav a { color: #38bdf8; text-decoration: none; margin-left: 16px; font-weight: 500; font-size: 14px; }
              .top-nav a:hover { text-decoration: underline; }
              .swagger-ui .topbar { display: none; }
              .swagger-ui .wrapper { max-width: 1200px; margin: 0 auto; padding: 20px; }
            </style>
          </head>
          <body>
            <div class="top-nav">
              <div><strong>mailtmapi</strong> API Documentation</div>
              <div>
                <a href="redoc.html">Switch to ReDoc</a>
                <a href="openapi.json" download>Download OpenAPI JSON</a>
              </div>
            </div>
            <div id="swagger-ui"></div>
            <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
            <script>
              window.onload = () => {
                window.ui = SwaggerUIBundle({
                  url: 'openapi.json',
                  dom_id: '#swagger-ui',
                  deepLinking: true,
                  presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.SwaggerUIStandalonePreset
                  ]
                });
              };
            </script>
          </body>
          </html>
          EOF

          cat << 'EOF' > public/redoc.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>mailtmapi API Documentation (ReDoc)</title>
            <style>body { margin: 0; padding: 0; }</style>
          </head>
          <body>
            <redoc spec-url="openapi.json"></redoc>
            <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
          </body>
          </html>
          EOF

      - name: Upload HTML Documentation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailtmapi-api-docs
          path: public/
          retention-days: 14

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Check Pages Deployment Result
        run: |
          if [ "${{ steps.deployment.outcome }}" != "success" ]; then
            echo "::warning::GitHub Pages deployment skipped or unconfigured. To publish automatically, enable GitHub Pages in Settings -> Pages -> Source: GitHub Actions."
          else
            echo "Successfully deployed documentation to GitHub Pages: ${{ steps.deployment.outputs.page_url }}"
          fi
