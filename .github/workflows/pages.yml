name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Performance Benchmarks Tracking"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Unified Developer Portal & Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Export OpenAPI 3.1 Schema
        run: uv run python scripts/export_openapi.py

      - name: Sync Continuous Benchmarks from gh-pages
        run: |
          git fetch origin gh-pages:gh-pages || true
          uv run python scripts/sync_benchmarks.py || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "site/package-lock.json"

      - name: Install Node dependencies
        working-directory: site
        run: npm ci

      - name: Build React SSG Developer Portal
        working-directory: site
        env:
          VITE_BASE: /maily/
        run: npm run build

      - name: Upload HTML Documentation Artifact
        uses: actions/upload-artifact@v7
        with:
          name: maily-portal
          path: public/
          include-hidden-files: true
          retention-days: 14

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/
          include-hidden-files: true

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Check Pages Deployment Result
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ "$DEPLOY_OUTCOME" != "success" ]; then
            echo "::warning::GitHub Pages deployment skipped or unconfigured. To publish automatically, enable GitHub Pages in Settings -> Pages -> Source: GitHub Actions."
          else
            echo "Successfully deployed documentation to GitHub Pages: $PAGE_URL"
          fi
